# Конфигурация системы сверки БУ-ПУ
# Пути для локальной разработки / тестирования (относительно корня репозитория).
# В продуктивной среде задайте переменную окружения NPF_DATA_DIR или измените base_dir.

base_dir: "data"   # Базовая директория данных (относительная или абсолютная)

# Имена подпапок внутри base_dir
pu_subdir: "ПУ"   # Персонифицированный учёт
bu_subdir: "БУ"   # Бухгалтерский учёт

# Путь к итоговому отчёту (относительный от корня репозитория)
output_file: "output/Сверка_БУ_ПУ.xlsx"

# Метка периода для заголовка отчёта
period_label: "Февраль 2026"

# Допуск для сравнения вещественных чисел (в рублях)
eps: 0.005

# =====================================================================
# СПРАВКА: Продуктивные пути Windows (закомментировано)
# Установите base_dir равным общему родительскому каталогу либо
# используйте NPF_DATA_DIR, указав полный путь к папке с данными.
#
# ПУ (Персонифицированный учёт):
#   С:\Сверка БУ-ПУ\Приложение_1\ПУ
#
# БУ (Бухгалтерский учёт):
#   AI-1С:\Сверка БУ-ПУ\Приложение_1\БУ
#
# При переносе задайте два явных абсолютных пути через переменные окружения
# NPF_PU_DIR и NPF_BU_DIR (поддерживается в config.py).
# =====================================================================
